<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/pufferfish_game.css">
	<link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
	<link rel="icon" href="../img/favicon.ico" type="image/x-icon">
	<script src="../js/jquery-3.5.1.min.js"></script>
	<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
	<title>복어게임</title>
</head>

<body>
	<div class="wrap aquarium_wrap">
		<header>
			<a href="#" aria-label="이전페이지로 이동" class="revious_link"></a>
			<h2>내 어항</h2>
		</header>
		<div class="contents">
			<p class="title">획득한 복어를 터치하여 포인트로 교환하세요.</p>
			<div class="aquarium_box">
				<ul class="aquarium_fish_group">
					<li class="fish">
						<span>1</span>
						<img src="../img/main-img-05@3x.png" alt="복어" class="img">
					</li>
					<li class="fish">
						<span>2</span>
						<img src="../img/main-img-02@3x.png" alt="복어" class="img">
					</li>
					<li class="fish">
						<span>4</span>
						<img src="../img/main-img-02@3x.png" alt="복어" class="img">
					</li>
					<li class="fish">
						<span>3</span>
						<img src="../img/main-img-01@3x.png" alt="복어" class="img">
					</li>
					<li class="fish">
						<span>5</span>
						<img src="../img/main-img-05@3x.png" alt="복어" class="img">
					</li>
				</ul>
			</div>
			<div class="label">미션을 수행하여 복어를 획득하세요!</div>
			<div class="box record_box">
				<h3>이번 달 활동 기록</h3>
				<ul>
					<li>
						<div class="fish">누적 획득 복어</div>
						<strong class="blue">120마리</strong>
					</li>
					<li>
						<div class="point">누적 획득 포인트</div>
						<strong class="red">1,233,000p</strong>
					</li>
				</ul>
			</div>
			<div class="box info_box">
				<h3>포인트 안내</h3>
				<ul>
					<li>포인트는 복어별 포인트 정책에 따라 금액이 상이합니다.</li>
					<li>적립 완료까지는 다소 시간이 소요될 수 있습니다.</li>
					<li>당첨된 포인트는 수령일로부터 12개월간 유효하며, 유효기간 경과 시 자동 소멸됩니다.</li>
				</ul>
			</div>
		</div>

		<img src="../img/sug-bg-01@3x.png" alt="물고기떼" class="fish_friend_rt">
		<img src="../img/sug-bg-02@3x.png" alt="물고기떼" class="fish_friend_lt">
	</div>

	<div class="popup_modal_wrap4">
		<div class="popup4">
			<button type="button" class="colose_btn"></button>
			<lottie-player class="lottie" src="../json/fishcoin.json" autoplay loop></lottie-player>
			<p class="add">1,000 포인트 획득!</p>
			<button type="button" class="point_btn red">포인트 이어서 받기</button>
		</div>
	</div>
	<script src="../js/pufferfish_game.js"></script>
</body>

</html>
